            --tag "$REGISTRY/$REPO_NAME/r-debug:latest-amd64" \
            --tag "$REGISTRY/$REPO_NAME/r-debug:latest" \
            r-debug
      - name: Save r-debug
        run: |
          mkdir -p /tmp/img-out
          docker save --output /tmp/img-out/r-debug.tar \
            "$REGISTRY/$REPO_NAME/r-debug:latest-amd64" "$REGISTRY/$REPO_NAME/r-debug:latest"
      - name: Upload r-debug
