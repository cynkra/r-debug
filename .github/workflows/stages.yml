# Generated by generate_stages.py, do not edit by hand
# Run 'make stages' to regenerate this file
#
# Pull-request CI: a `detect` pre-step computes the build plan (the images
# changed in this PR plus their transitive downstream dependents); each image
# job runs only if it is in the plan and is otherwise SKIPPED. In-plan images
# build in parallel (ordered by `needs`) and are handed to dependents as
# artifacts (docker save + upload-artifact -> download-artifact + docker load);
# an unchanged dependency is pulled from the registry instead. Nothing is
# pushed to any registry. Builds the native amd64 arch only; full multi-arch
# build + publish happens on main via push.yml.
#
# The final `CI` job is the required status check for auto-merge
# (see github-docker/rulesets/auto-merge.json, context "CI").
name: CI

on:
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  REPO_NAME: ${{ github.repository }}

jobs:

  detect:
    name: detect
    runs-on: ubuntu-24.04
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Compute build plan (changed images + downstream)
        id: plan
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # --- Baked dependency graph (generated) ---
          declare -A PATHS=(
            ["r-debug"]="r-debug"
            ["r-debug-csan"]="r-debug/csan"
            ["r-debug-csan-igraph"]="r-debug/csan/igraph"
            ["r-debug-duckdb"]="r-debug/duckdb"
            ["r-debug-san"]="r-debug/san"
            ["r-debug-strictbarrier"]="r-debug/strictbarrier"
            ["r-debug-strictbarrier-igraph"]="r-debug/strictbarrier/igraph"
            ["r-debug-threadcheck"]="r-debug/threadcheck"
            ["r-debug-threadcheck-igraph"]="r-debug/threadcheck/igraph"
            ["r-debug-valgrind"]="r-debug/valgrind"
            ["r-debug-valgrind-igraph"]="r-debug/valgrind/igraph"
          )
          declare -A DEPS=(
            ["r-debug"]=""
            ["r-debug-csan"]="r-debug"
            ["r-debug-csan-igraph"]="r-debug-csan"
            ["r-debug-duckdb"]="r-debug"
            ["r-debug-san"]="r-debug"
            ["r-debug-strictbarrier"]="r-debug"
            ["r-debug-strictbarrier-igraph"]="r-debug-strictbarrier"
            ["r-debug-threadcheck"]="r-debug"
            ["r-debug-threadcheck-igraph"]="r-debug-threadcheck"
            ["r-debug-valgrind"]="r-debug"
            ["r-debug-valgrind-igraph"]="r-debug-valgrind"
          )
          ALL_IMAGES=(
            r-debug
            r-debug-csan
            r-debug-csan-igraph
            r-debug-duckdb
            r-debug-san
            r-debug-strictbarrier
            r-debug-strictbarrier-igraph
            r-debug-threadcheck
            r-debug-threadcheck-igraph
            r-debug-valgrind
            r-debug-valgrind-igraph
          )
          # Echo the image whose directory is the longest matching prefix of $1.
          image_for_path() {
            local path="$1" best="" bestlen=0 img d
            for img in "${ALL_IMAGES[@]}"; do
              d="${PATHS[$img]}"
              if [ "$path" = "$d" ] || [ "${path#"$d"/}" != "$path" ]; then
                if [ "${#d}" -gt "$bestlen" ]; then best="$img"; bestlen="${#d}"; fi
              fi
            done
            printf '%s' "$best"
          }

          # 1. Map changed files to the images that own them (the seed).
          declare -A seed=()
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            img="$(image_for_path "$f")"
            [ -n "$img" ] && seed["$img"]=1
          done < <(git diff --name-only "${BASE_SHA}...${HEAD_SHA}")

          # 2. Reverse adjacency: dependency -> its direct dependents.
          declare -A rdeps=()
          for img in "${ALL_IMAGES[@]}"; do
            for dep in ${DEPS[$img]:-}; do
              rdeps["$dep"]="${rdeps[$dep]:-} ${img}"
            done
          done

          # 3. Transitive downstream closure of the seed.
          declare -A inset=()
          worklist=()
          for img in "${!seed[@]}"; do inset["$img"]=1; worklist+=("$img"); done
          while [ "${#worklist[@]}" -gt 0 ]; do
            cur="${worklist[0]}"; worklist=("${worklist[@]:1}")
            for d in ${rdeps["$cur"]:-}; do
              [ -n "${inset[$d]:-}" ] || { inset["$d"]=1; worklist+=("$d"); }
            done
          done

          # 4. Emit the plan as a JSON array (image names are [A-Za-z0-9-]; no escaping).
          plan="["
          sep=""
          for img in "${ALL_IMAGES[@]}"; do
            if [ -n "${inset[$img]:-}" ]; then
              plan="${plan}${sep}\"${img}\""
              sep=","
            fi
          done
          plan="${plan}]"

          echo "Changed images: ${!seed[*]}"
          echo "Build plan (changed + downstream): ${plan}"
          echo "plan=${plan}" >> "$GITHUB_OUTPUT"

